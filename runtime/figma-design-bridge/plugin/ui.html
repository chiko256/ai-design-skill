<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:12px/1.6 Inter,system-ui,sans-serif;margin:0;padding:22px;color:var(--figma-color-text,#202126);background:var(--figma-color-bg,#fff)}
h1{font-size:20px;letter-spacing:-.5px;margin:0 0 6px}p{color:var(--figma-color-text-secondary,#70737d);margin:0 0 16px}label{display:block;margin:13px 0 5px;font-weight:600}
input{width:100%;padding:9px;border:1px solid var(--figma-color-border,#ddd);border-radius:6px;background:var(--figma-color-bg,#fff);color:inherit}button{border:0;border-radius:6px;padding:10px 14px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:default}
.primary{background:#315c48;color:white;width:100%;margin-top:14px}.secondary{background:var(--figma-color-bg-secondary,#f1f3f2);color:inherit}#status{margin:16px 0 8px;padding:10px;border-radius:6px;background:var(--figma-color-bg-secondary,#f1f3f2);white-space:pre-wrap;overflow-wrap:anywhere}.row{display:flex;gap:8px;align-items:center;margin-top:12px}.row button{flex:1}small{display:block;color:var(--figma-color-text-secondary,#777)}#log{max-height:85px;overflow:auto;font-size:11px;white-space:pre-wrap}#file{display:none}details{margin-top:16px}summary{cursor:pointer;color:var(--figma-color-text-secondary,#777)}#code{font-size:22px;letter-spacing:3px;text-transform:uppercase;text-align:center}#pair{margin-bottom:4px}
</style></head><body>
<h1>Figma Design Bridge</h1><p>CodexからFigmaを編集するための接続です。接続後は、この画面を開いたまま制作を依頼してください。</p>
<label for="code">Codexの接続コード</label><input id="code" placeholder="ABCD-2345" maxlength="12" autocomplete="off" spellcheck="false">
<button class="primary" id="pair">接続する</button><small>コードは5分間有効・1回限りです。</small>
<details id="advanced"><summary>詳細設定・従来の接続方法</summary>
<label for="url">ローカル接続先</label><input id="url" value="http://localhost:3849">
<label for="token">接続キー</label><input id="token" type="password" placeholder="connection.json の token" autocomplete="off">
<label for="connection">接続設定を読み込む</label><input id="connection" type="file" accept="application/json,.json">
<button class="primary" id="connect">このファイルに接続</button>
</details>
<div id="status">未接続</div><small id="context"></small>
<div class="row"><button id="disconnect" class="secondary" disabled>接続を停止</button><button id="import" class="secondary">JSONを実行</button></div>
<input id="file" type="file" accept="application/json,.json"><div id="log"></div>
<script>
'use strict';
const $=id=>document.getElementById(id);
window.addEventListener('error',e=>{$('status').textContent='UIエラー: '+e.message});
// Figma's sandbox does not guarantee crypto.randomUUID (secure-context only).
// These IDs correlate local messages; authentication uses the separate bridge token.
function localId(){return typeof crypto?.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2)}
const sessionId=localId();
let connected=false, context=null, timer=null, working=false, resultPending=null, offlineJob=null;
let base='',token='',connecting=false;
function status(s){$('status').textContent=s}
function log(s){$('log').textContent=(s+'\n'+$('log').textContent).slice(0,1800)}
function post(m){parent.postMessage({pluginMessage:m},'*')}
async function fetchLocal(url,options){
 const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),10000);
 try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timeout)}
}
async function request(p,method='GET',body){
 const response=await fetchLocal(base+p,{method,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});
 const data=await response.json();if(!response.ok){const error=new Error(data.error||('HTTP '+response.status));error.status=response.status;throw error}return data;
}
function resetButtons(){ $('pair').disabled=connected||working||connecting; $('code').disabled=connected||working||connecting; $('connect').disabled=connected||working||connecting; $('disconnect').disabled=!connected; $('import').disabled=connected||working; }
async function poll(){
 if(!connected)return;
 try{
  if(resultPending){await request('/jobs/'+resultPending.id+'/result','POST',resultPending);log('完了: '+resultPending.id.slice(0,8));resultPending=null;working=false;status('接続中 · 次の作業を待っています');}
  const response=await request('/next?sessionId='+encodeURIComponent(sessionId));
  if(response.job && !working){working=true;status('実行中: '+response.job.command.op);post({type:'execute',id:response.job.id,job:response.job.command});}
 }catch(e){
  if(e.status===409&&e.message==='Reconnect the plugin'&&!working&&!resultPending){
   try{await request('/connect','POST',{sessionId,context});status('再接続しました · 次の作業を待っています')}catch(reconnectError){status('接続確認中: '+reconnectError.message)}
  }else status('接続確認中: '+e.message);
 }
 resetButtons();timer=setTimeout(poll,1200);
}
function beginConnect(){connecting=true;resetButtons();status('ファイルを確認しています');post({type:'hello'});}
$('pair').onclick=async()=>{
 if(connected||working||connecting)return;
 const code=$('code').value.replace(/[\s-]/g,'').toUpperCase();
 if(!/^[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{8}$/.test(code)){status('8文字の接続コードを入力してください');return}
 connecting=true;resetButtons();status('接続しています');
 try{
  const r=await fetchLocal('http://localhost:3849/pair/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  const c=await r.json();if(!r.ok)throw new Error(c.error||('HTTP '+r.status));
  if(c.url!=='http://localhost:3849'||typeof c.token!=='string'||!c.token)throw new Error('接続設定を確認できませんでした');
  base=c.url;token=c.token;$('url').value=base;$('token').value=token;$('code').value='';beginConnect();
 }catch(e){connecting=false;status(e instanceof TypeError||e.name==='AbortError'?'Bridgeが見つかりません。Codexに起動を依頼してください。':e.message);resetButtons()}
};
$('connect').onclick=()=>{
 if(connected||working||connecting)return;
 base=$('url').value.trim().replace(/\/$/,'');token=$('token').value.trim();
 if(!/^http:\/\/(127\.0\.0\.1|localhost):3849$/.test(base)){status('接続先は localhost:3849 を指定してください');return}
 // Figma's manifest validator accepts the documented localhost development domain.
 // Normalize the old UI value before any request so it matches the manifest's CSP.
 base='http://localhost:3849';$('url').value=base;
 if(!token){status('接続キーを入力してください');return}
 beginConnect();
};
$('disconnect').onclick=async()=>{
 if(working){status('実行中です。結果の保存後に停止してください');return}
 connected=false;clearTimeout(timer);try{await request('/disconnect','POST',{sessionId})}catch(_){}
 status('接続を停止しました');resetButtons();
};
$('import').onclick=()=>$('file').click();
$('connection').onchange=async e=>{
 try{const f=e.target.files[0];if(!f)return;if(f.size>4096)throw new Error('接続設定が大きすぎます');
 const c=JSON.parse(await f.text());if(!/^http:\/\/(127\.0\.0\.1|localhost):3849\/?$/.test(c.url)||typeof c.token!=='string'||!c.token)throw new Error('このブリッジのconnection.jsonを選んでください');
 $('url').value='http://localhost:3849';$('token').value=c.token;status('接続設定を読み込みました');
 }catch(e){status(e.message)}finally{e.target.value=''}
};
$('file').onchange=async e=>{
 try{
  if(working||connected)throw new Error('接続を停止してから読み込んでください');
  const file=e.target.files[0];if(!file)return;if(file.size>48*1024*1024)throw new Error('JSONが48MBを超えています');
  const job=JSON.parse(await file.text());
  if(!job.op)throw new Error('op がある実行用JSONを選んでください');
  // Import is an explicit local action by the user. No external service is contacted.
  offlineJob='offline-'+localId();working=true;resetButtons();status('実行中: '+job.op);post({type:'execute',id:offlineJob,job});
 }catch(e){status(e.message)}finally{$('file').value=''}
};
function download(name,blob){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
onmessage=async event=>{
 const m=event.data.pluginMessage;if(!m)return;
 if(m.type==='hello'){
  context=m.context;$('context').textContent=context.fileName+' / '+context.pageId;
  try{await request('/connect','POST',{sessionId,context});connected=true;connecting=false;status('接続中 · 次の作業を待っています');resetButtons();clearTimeout(timer);poll()}catch(e){connecting=false;status(e.message);resetButtons()}
 }
 if(m.type==='result'){
  if(m.id===offlineJob){
   if(m.result&&m.result.binary){const bytes=new Uint8Array(m.result.binary);download('stage10-preview.'+(m.result.format==='SVG'?'svg':'png'),new Blob([bytes]));delete m.result.binary;}
   download('stage10-result.json',new Blob([JSON.stringify(m,null,2)],{type:'application/json'}));
   working=false;offlineJob=null;status(m.ok?'実行完了 · 結果を保存しました':'実行エラー: '+m.error);resetButtons();return;
  }
  if(m.result&&m.result.binary){
   let s='';const a=m.result.binary;for(let i=0;i<a.length;i+=16384)s+=String.fromCharCode.apply(null,a.slice(i,i+16384));
   m.result.binaryBase64=btoa(s);delete m.result.binary;
  }
  resultPending={...m,sessionId};status(m.ok?'結果を保存しています':'エラーを記録しています');
 }
};
</script></body></html>
